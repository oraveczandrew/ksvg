<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grayscale" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="100" height="100" fill="red" filter="url(#grayscale)"/>
  <rect x="136" y="20" width="100" height="100" fill="green" filter="url(#grayscale)"/>
  <rect x="20" y="136" width="100" height="100" fill="blue" filter="url(#grayscale)"/>
  <rect x="136" y="136" width="100" height="100" fill="yellow" filter="url(#grayscale)"/>
</svg>
