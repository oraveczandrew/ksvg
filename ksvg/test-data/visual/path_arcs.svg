<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Test all 4 arc combinations -->
  <!-- A rx ry x-axis-rotation large-arc-flag sweep-flag x y -->
  <g stroke="black" fill="none" stroke-width="2">
    <!-- large-arc=0 sweep=0 (Small, CCW) -->
    <path d="M 100,100 A 50,50 0 0 0 150,150" stroke="red"/>
    <!-- large-arc=0 sweep=1 (Small, CW) -->
    <path d="M 250,100 A 50,50 0 0 1 300,150" stroke="green"/>
    <!-- large-arc=1 sweep=0 (Large, CCW) -->
    <path d="M 100,250 A 50,50 0 1 0 150,300" stroke="blue"/>
    <!-- large-arc=1 sweep=1 (Large, CW) -->
    <path d="M 250,250 A 50,50 0 1 1 300,300" stroke="orange"/>
  </g>
  <!-- Test x-axis rotation -->
  <path d="M 50,350 A 80,30 30 0 1 150,350" stroke="purple" fill="none" stroke-width="2"/>
</svg>
