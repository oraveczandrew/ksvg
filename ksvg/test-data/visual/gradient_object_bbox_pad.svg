<svg width="300" height="140" viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="p" gradientUnits="objectBoundingBox" spreadMethod="pad">
            <stop offset="0" stop-color="red" />
            <stop offset="1" stop-color="blue" />
        </linearGradient>
        <linearGradient id="r" gradientUnits="objectBoundingBox" spreadMethod="repeat">
            <stop offset="0" stop-color="gold" />
            <stop offset="1" stop-color="black" />
        </linearGradient>
    </defs>
    <rect x="20" y="20" width="110" height="90" fill="url(#p)" />
    <rect x="170" y="20" width="110" height="90" fill="url(#r)" />
    
</svg>