<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="20" height="20" fill="red">
    <animateTransform attributeName="transform" type="translate"
      from="0,0" to="50,0" dur="2s" repeatCount="3"
      additive="sum" accumulate="sum" fill="freeze" />
  </rect>

  <rect x="0" y="50" width="20" height="20" fill="blue">
    <!-- Base transform -->
    <animateTransform attributeName="transform" type="scale"
      from="1" to="2" dur="2s" repeatCount="indefinite" />
    <!-- Additive rotation -->
    <animateTransform attributeName="transform" type="rotate"
      from="0 10 60" to="360 10 60" dur="4s" repeatCount="indefinite"
      additive="sum" />
  </rect>
</svg>
