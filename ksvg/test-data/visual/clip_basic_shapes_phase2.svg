<svg width="256" height="384" viewBox="0 0 256 384" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5252"/>
      <stop offset="0.25" stop-color="#ffb300"/>
      <stop offset="0.5" stop-color="#00c853"/>
      <stop offset="0.75" stop-color="#448aff"/>
      <stop offset="1" stop-color="#d500f9"/>
    </linearGradient>
    <pattern id="checker2" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff8e1"/>
      <rect width="8" height="8" fill="#ff8f00"/>
      <rect x="8" y="8" width="8" height="8" fill="#ff8f00"/>
    </pattern>
  </defs>
  <rect width="256" height="384" fill="#263238"/>
  <!-- rect(): absolute edges, elliptical corners via the slash radii syntax -->
  <rect x="8" y="8" width="112" height="112" fill="url(#rainbow2)" clip-path="rect(10px 100px 100px 10px round 20px / 8px)"/>
  <!-- xywh() -->
  <rect x="136" y="8" width="112" height="112" fill="url(#checker2)" clip-path="xywh(14px 14px 84px 84px)"/>
  <!-- path() with evenodd and a hole -->
  <rect x="8" y="136" width="112" height="112" fill="url(#rainbow2)" clip-path="path(evenodd, 'M56 4 L108 56 L56 108 L4 56 Z M56 28 L84 56 L56 84 L28 56 Z')"/>
  <!-- circle(closest-side) -->
  <rect x="136" y="136" width="112" height="112" fill="url(#checker2)" clip-path="circle(closest-side at center center)"/>
  <!-- ellipse(): per-axis side keywords, percentage radius and position -->
  <rect x="8" y="264" width="112" height="112" fill="url(#rainbow2)" clip-path="ellipse(farthest-side 30% at 70% 30%)"/>
  <!-- path() built from elliptical arcs -->
  <rect x="136" y="264" width="112" height="112" fill="url(#checker2)" clip-path="path('M8 56 A48 48 0 1 1 104 56 A48 48 0 1 1 8 56 Z')"/>
</svg>
