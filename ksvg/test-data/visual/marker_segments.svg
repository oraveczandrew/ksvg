<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="5" fill="green" />
    </marker>
    <marker id="m-mid" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <rect width="10" height="10" fill="blue" />
    </marker>
    <marker id="m-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="red" />
    </marker>
  </defs>

  <path d="M 20,20 L 80,20 L 80,80 L 140,80"
    fill="none" stroke="black" stroke-width="2"
    marker-start="url(#m-start)"
    marker-mid="url(#m-mid)"
    marker-end="url(#m-end)" />

  <path d="M 20,120 C 50,120 50,180 80,180 S 110,120 140,120"
    fill="none" stroke="gray" stroke-width="2"
    marker-start="url(#m-start)"
    marker-mid="url(#m-mid)"
    marker-end="url(#m-end)" />
</svg>
