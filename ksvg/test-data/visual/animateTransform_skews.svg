<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(60 70)">
    <rect x="-20" y="-20" width="40" height="40" fill="tomato">
      <animateTransform attributeName="transform" type="skewX" from="-25" to="25" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(180 140)">
    <rect x="-20" y="-20" width="40" height="40" fill="royalblue">
      <animateTransform attributeName="transform" type="skewY" from="-20" to="20" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
