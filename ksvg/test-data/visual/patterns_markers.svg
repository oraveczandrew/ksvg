<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pat1" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="5" fill="red" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
    </marker>
  </defs>
  <rect x="10" y="10" width="180" height="80" fill="url(#pat1)" stroke="black" />
  <path d="M 20 150 L 180 150" stroke="blue" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  
</svg>