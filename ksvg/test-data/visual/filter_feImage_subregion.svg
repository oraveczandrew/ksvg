<!-- Same as filter_feImage.svg, but the feImage carries an explicit primitive
     subregion disjoint from the referenced circle (circle spans x 65..175,
     y 45..155; subregion is x 0..40, y 180..220). The img result must be
     fully transparent, so no gold pixels may appear. -->
<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="mix" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="220">
      <feImage href="#source" x="0" y="180" width="40" height="40" result="img"/>
      <feBlend in="SourceGraphic" in2="img" mode="screen"/>
    </filter>
    <circle id="source" cx="120" cy="100" r="55" fill="gold"/>
  </defs>
  <rect x="0" y="0" width="240" height="180" fill="midnightblue"/>
  <circle cx="120" cy="100" r="70" fill="tomato" filter="url(#mix)"/>
</svg>
