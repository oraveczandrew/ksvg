<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#f0f0f0" />
  <!-- Nested SVG 1: Top-Left, 100x100 space, viewBox makes it 50x50 internal -->
  <svg x="10" y="10" width="80" height="80" viewBox="0 0 50 50">
    <rect width="50" height="50" fill="royalblue" />
    <circle cx="25" cy="25" r="20" fill="white" />
  </svg>
  <!-- Nested SVG 2: Bottom-Right, using preserveAspectRatio -->
  <svg x="110" y="110" width="80" height="80" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
    <rect width="100" height="50" fill="crimson" />
  </svg>
  <!-- Nested SVG 3: Middle, no dimensions, should default to 100% (of outer viewport) -->
  <g transform="translate(50, 50)">
    <svg width="100" height="100">
       <rect width="100" height="100" fill="none" stroke="black" stroke-dasharray="4" />
       <circle cx="50" cy="50" r="10" fill="gold" />
    </svg>
  </g>
</svg>
