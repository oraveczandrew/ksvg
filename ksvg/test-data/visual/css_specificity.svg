<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Specificity 1: Element */
    rect { fill: gray; stroke: black; }

    /* Specificity 1000: Class */
    .blue { fill: blue; }

    /* Specificity 1001: Element + Class (Higher than class alone) */
    rect.green { fill: green; }

    /* Specificity 1000000: ID (Wins over classes) */
    #red-rect { fill: red; }

    /* Specificity 2000: Two classes */
    .c1.c2 { fill: purple; }

    /* Presentation attributes vs CSS (CSS wins if specificity > 0) */
    .forced-orange { fill: orange; }
  </style>

  <!-- Should be gray (element selector) -->
  <rect x="10" y="10" width="30" height="30" />

  <!-- Should be blue (class selector) -->
  <rect x="50" y="10" width="30" height="30" class="blue" />

  <!-- Should be green (element.class > class) -->
  <rect x="90" y="10" width="30" height="30" class="blue green" />

  <!-- Should be red (ID wins) -->
  <rect x="130" y="10" width="30" height="30" id="red-rect" class="green" />

  <!-- Should be purple (two classes > one class) -->
  <rect x="10" y="50" width="30" height="30" class="c1 c2 blue" />

  <!-- Should be orange (CSS wins over fill="yellow") -->
  <rect x="50" y="50" width="30" height="30" class="forced-orange" fill="yellow" />
</svg>
