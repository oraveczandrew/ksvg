<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    rect { fill: gray; }
    .red { fill: red; }
    #blue-rect { fill: blue; }
    rect.green { fill: green; }
    g > rect.nested { fill: orange; }
    [data-type="special"] { stroke: purple; stroke-width: 5; }
  </style>

  <rect x="10" y="10" width="40" height="40" />
  <rect x="60" y="10" width="40" height="40" class="red" />
  <rect x="110" y="10" width="40" height="40" id="blue-rect" />
  <rect x="160" y="10" width="40" height="40" class="green" />

  <g>
    <rect x="10" y="60" width="40" height="40" class="nested" />
  </g>

  <rect x="60" y="60" width="40" height="40" data-type="special" fill="yellow" />
</svg>
