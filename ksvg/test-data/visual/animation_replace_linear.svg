<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="20" width="60" height="25" fill="red">
        <animate attributeName="x" from="10" to="250" dur="2s" repeatCount="indefinite" calcMode="linear"
            additive="replace" accumulate="replace" />
    </rect>
    <rect x="10" y="70" width="60" height="25" fill="blue">
        <animate attributeName="x" values="10;130;250" dur="2s" repeatCount="indefinite" calcMode="paced" />
    </rect>
    <text x="160" y="38" font-size="10">linear + replace</text>
    <text x="160" y="88" font-size="10">paced</text>
</svg>