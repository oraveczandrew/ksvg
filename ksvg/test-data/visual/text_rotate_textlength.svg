<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="256" height="256" fill="white"/>
  <!-- per-character rotation supplements the baseline (advances unaffected) -->
  <text x="20" y="60" font-size="36" fill="red" rotate="0 30 60 90">ABCD</text>
  <!-- spacing stretch: advances sum to the target -->
  <text x="20" y="120" font-size="28" fill="blue" textLength="210">Stretch</text>
  <!-- spacing squeeze -->
  <text x="20" y="170" font-size="28" fill="green" textLength="60" lengthAdjust="spacing">Squeeze</text>
  <!-- tspan-level rotation + textLength -->
  <text x="20" y="220" font-size="28" fill="black">A<tspan rotate="45">B</tspan><tspan textLength="90">CD</tspan></text>
</svg>
