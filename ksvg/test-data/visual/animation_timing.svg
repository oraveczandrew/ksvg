<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="80" width="35" height="35" fill="tomato">
    <animate attributeName="x" from="20" to="185" dur="4s" begin="0.5s" end="3.5s" repeatCount="2" fill="freeze"/>
  </rect>
  <rect x="20" y="140" width="35" height="35" fill="royalblue">
    <animate attributeName="x" from="20" to="185" dur="2s" begin="0s" repeatDur="5s" fill="remove"/>
  </rect>
  <text x="120" y="30" text-anchor="middle" font-size="12">begin / end / repeatDur</text>
</svg>
