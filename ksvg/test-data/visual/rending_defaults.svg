<svg width="360" height="150" viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
    <rect width="360" height="150" fill="white" />
    <g font-size="11">
        <svg x="10" y="10" width="80" height="80" overflow="hidden">
            <rect x="-10" y="-10" width="100" height="100" fill="orange" />
            <text x="5" y="75">hidden</text>
        </svg>
        <svg x="100" y="10" width="80" height="80" overflow="visible">
            <rect x="-10" y="-10" width="100" height="100" fill="lightblue" />
            <text x="5" y="75">visible</text>
        </svg>
        <rect x="200" y="20" width="55" height="55" fill="red" vector-effect="none" isolation="auto" />
        <rect x="270" y="20" width="55" height="55" fill="blue" vector-effect="non-scaling-stroke" isolation="isolate"
            stroke="black" stroke-width="10" />
        <text x="90" y="120">overflow / vector-effect / isolation branches</text>
    </g>
</svg>