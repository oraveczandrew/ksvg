<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="80" y="80" width="40" height="40" fill="red">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="20" width="30" height="30" fill="green">
    <animateTransform attributeName="transform" type="scale" from="1" to="2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="150" y="150" width="30" height="30" fill="blue">
    <animateTransform attributeName="transform" type="skewX" from="0" to="45" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
