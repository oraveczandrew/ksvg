<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <line x1="150" y1="0" x2="150" y2="300" stroke="lightgray" stroke-dasharray="4"/>

  <g font-family="sans-serif" font-size="20">
    <text x="150" y="50" text-anchor="start">Start Anchor</text>
    <text x="150" y="100" text-anchor="middle">Middle Anchor</text>
    <text x="150" y="150" text-anchor="end">End Anchor</text>
  </g>

  <line x1="0" y1="220" x2="300" y2="220" stroke="lightgray" stroke-dasharray="4"/>
  <g font-family="sans-serif" font-size="20">
    <text x="20" y="220" dominant-baseline="auto">Auto</text>
    <text x="80" y="220" dominant-baseline="middle">Middle</text>
    <text x="160" y="220" dominant-baseline="hanging">Hanging</text>
    <text x="250" y="220" dominant-baseline="ideographic">Ideographic</text>
  </g>
</svg>
