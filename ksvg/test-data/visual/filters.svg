<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="60" height="60" fill="red" filter="url(#blur)" />
  <circle cx="140" cy="50" r="30" fill="blue" filter="url(#shadow)" />
  <text x="100" y="120" text-anchor="middle" font-size="20" filter="url(#shadow)">Filtered Text</text>
</svg>