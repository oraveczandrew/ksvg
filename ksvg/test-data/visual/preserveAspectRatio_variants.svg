<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="240" height="220" fill="whitesmoke"/>
  <rect x="15" y="25" width="70" height="150" fill="orange" preserveAspectRatio="xMinYMin meet"/>
  <rect x="95" y="25" width="70" height="150" fill="royalblue" preserveAspectRatio="xMidYMid meet"/>
  <rect x="175" y="25" width="50" height="150" fill="seagreen" preserveAspectRatio="xMaxYMax slice"/>
  <circle cx="50" cy="100" r="14" fill="white"/>
  <circle cx="130" cy="100" r="14" fill="white"/>
  <circle cx="200" cy="100" r="14" fill="white"/>
  <text x="120" y="205" text-anchor="middle" font-size="11">meet / slice alignment</text>
</svg>
