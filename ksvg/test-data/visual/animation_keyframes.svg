<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="30" cy="100" r="18" fill="purple">
    <animate attributeName="cx" values="30;170;30" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="90" y="90" width="20" height="20" fill="orange">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
