<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
    <path id="p" d="M20 95 C80 10 160 10 220 95" fill="none" stroke="lightgray" />
    <circle cx="20" cy="95" r="7" fill="red">
        <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
            <mpath href="#p" />
        </animateMotion>
    </circle>
    <circle cx="20" cy="95" r="7" fill="blue">
        <animateMotion dur="2s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="0;.5;1">
            <mpath href="#p" />
        </animateMotion>
    </circle>
    <text x="270" y="35" font-size="10">auto / auto-reverse</text>
    <text x="270" y="55" font-size="10">keyPoints</text>
</svg>