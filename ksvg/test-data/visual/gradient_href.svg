<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="derived" href="#base" gradientTransform="rotate(90)"/>
    <radialGradient id="radBase" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="white"/><stop offset="1" stop-color="green"/>
    </radialGradient>
    <radialGradient id="radDerived" href="#radBase" fx="0.7" fy="0.7"/>
  </defs>
  <rect x="10" y="10" width="100" height="90" fill="url(#base)"/>
  <rect x="130" y="10" width="100" height="90" fill="url(#derived)"/>
  <rect x="10" y="120" width="100" height="90" fill="url(#radBase)"/>
  <rect x="130" y="120" width="100" height="90" fill="url(#radDerived)"/>
</svg>
