<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lighting" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence baseFrequency="0.03" numOctaves="1" result="noise"/>
      <feDiffuseLighting in="noise" surfaceScale="5" diffuseConstant="1" lighting-color="white">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="256" height="256" fill="green" filter="url(#lighting)"/>
</svg>
