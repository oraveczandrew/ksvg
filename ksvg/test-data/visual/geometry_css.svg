<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <style>
    circle.styled { r: 40px; cx: 64px; cy: 64px }
    rect.styled { x: 150px; y: 30px; width: 70px; height: 70px; rx: 12px }
  </style>
  <!-- attribute-only baseline: r=20 circle at (64, 192), 20x20 rect at (150, 150) -->
  <circle cx="64" cy="192" r="20" fill="red"/>
  <rect x="150" y="150" width="20" height="20" fill="red"/>
  <!-- stylesheet geometry overrides the attributes below -->
  <circle class="styled" cx="10" cy="10" r="5" fill="blue"/>
  <rect class="styled" x="10" y="130" width="10" height="10" fill="blue"/>
  <!-- inline style beats both attribute and stylesheet -->
  <ellipse cx="10" cy="10" rx="5" ry="5" style="cx: 192; cy: 192; rx: 30; ry: 18" fill="green"/>
</svg>
