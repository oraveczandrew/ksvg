<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g font-family="sans-serif" font-size="20" fill="black">
    <!-- Text Decoration -->
    <text x="20" y="40" text-decoration="overline">Overline decoration</text>
    <text x="20" y="80" text-decoration="underline line-through overline">Triple decoration</text>

    <!-- Text Transform -->
    <text x="20" y="130" text-transform="uppercase">uppercase transform</text>
    <text x="20" y="160" text-transform="lowercase">LOWERCASE TRANSFORM</text>
    <text x="20" y="190" text-transform="capitalize">capitalize first letters</text>

    <!-- Baseline Shift -->
    <text x="20" y="250">
      Regular <tspan baseline-shift="super" font-size="12">super</tspan>
      and <tspan baseline-shift="sub" font-size="12">sub</tspan> script
    </text>
    <text x="20" y="280">
      Offset <tspan baseline-shift="10" font-size="12">shifted by 10px</tspan>
    </text>

    <!-- Alignment Baseline -->
    <line x1="0" y1="350" x2="400" y2="350" stroke="lightgray" stroke-dasharray="4"/>
    <text x="20" y="350" alignment-baseline="hanging">Hanging</text>
    <text x="120" y="350" alignment-baseline="middle">Middle</text>
    <text x="220" y="350" alignment-baseline="central">Central</text>
    <text x="320" y="350" alignment-baseline="ideographic">Ideo</text>
  </g>
</svg>
