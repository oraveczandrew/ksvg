  <g font-family="sans-serif">
    <text x="10" y="35" font-size="20" font-stretch="condensed" font-variant="small-caps">Condensed small caps</text>
    <text x="10" y="75" font-size="20" font-variant="all-small-caps" font-kerning="normal">Kerning</text>
    <text x="10" y="115" font-size="20" font-feature-settings="&quot;liga&quot; 0" font-variant-ligatures="none">Ligature control</text>
