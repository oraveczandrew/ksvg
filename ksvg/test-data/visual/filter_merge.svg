<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="merge" x="0" y="0" width="100%" height="100%">
      <feFlood flood-color="red" x="0" y="0" width="100" height="100" result="red"/>
      <feFlood flood-color="green" x="100" y="100" width="100" height="100" result="green"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="red"/>
        <feMergeNode in="green"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="25" y="25" width="206" height="206" fill="blue" filter="url(#merge)"/>
</svg>
