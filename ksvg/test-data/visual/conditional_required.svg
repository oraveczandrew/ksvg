<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <switch>
    <rect requiredFeatures="http://www.w3.org/TR/SVG11/feature#Shape" x="10" y="20" width="100" height="60" fill="seagreen"/>
    <rect requiredExtensions="http://example.invalid/ext" x="10" y="20" width="100" height="60" fill="tomato"/>
  </switch>
  <switch>
    <rect requiredFormats="image/svg+xml" x="130" y="20" width="100" height="60" fill="royalblue"/>
    <rect requiredFonts="sans-serif" x="130" y="20" width="100" height="60" fill="tomato"/>
  </switch>
</svg>
