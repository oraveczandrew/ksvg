<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5252"/>
      <stop offset="0.25" stop-color="#ffb300"/>
      <stop offset="0.5" stop-color="#00c853"/>
      <stop offset="0.75" stop-color="#448aff"/>
      <stop offset="1" stop-color="#d500f9"/>
    </linearGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff8e1"/>
      <rect width="8" height="8" fill="#ff8f00"/>
      <rect x="8" y="8" width="8" height="8" fill="#ff8f00"/>
    </pattern>
    <clipPath id="grow"><circle cx="64" cy="64" r="8">
      <animate attributeName="r" from="8" to="50" begin="0s" dur="4s" repeatCount="indefinite"/>
    </circle></clipPath>
    <clipPath id="widen"><rect x="142" y="20" width="16" height="88">
      <animate attributeName="width" from="16" to="100" begin="0s" dur="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="slide"><circle cx="30" cy="192" r="30">
      <animate attributeName="cx" from="30" to="98" begin="0s" dur="4s" repeatCount="indefinite"/>
    </circle></clipPath>
    <clipPath id="flip"><polygon points="150,232 192,148 234,232">
      <animate attributeName="points" values="150,232 192,148 234,232;150,190 192,232 234,190"
        begin="0s" dur="4s" repeatCount="indefinite"/>
    </polygon></clipPath>
  </defs>
  <rect width="256" height="256" fill="#263238"/>
  <!-- circle r animation inside <clipPath> -->
  <rect x="8" y="8" width="112" height="112" fill="url(#rainbow)" clip-path="url(#grow)"/>
  <!-- rect width animation inside <clipPath> -->
  <rect x="136" y="8" width="112" height="112" fill="url(#checker)" clip-path="url(#widen)"/>
  <!-- circle cx animation inside <clipPath> -->
  <rect x="8" y="136" width="112" height="112" fill="url(#rainbow)" clip-path="url(#slide)"/>
  <!-- polygon points animation inside <clipPath> -->
  <rect x="136" y="136" width="112" height="112" fill="url(#checker)" clip-path="url(#flip)"/>
</svg>
