<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lin1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red" />
      <stop offset="100%" stop-color="blue" />
    </linearGradient>
    <radialGradient id="rad1" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="yellow" />
      <stop offset="100%" stop-color="green" />
    </radialGradient>
    <linearGradient id="lin2" x1="0%" y1="0%" x2="50%" y2="50%" spreadMethod="reflect">
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="black" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="50" fill="url(#lin1)" />
  <circle cx="50" cy="130" r="40" fill="url(#rad1)" />
  <rect x="110" y="90" width="80" height="80" fill="url(#lin2)" />
</svg>