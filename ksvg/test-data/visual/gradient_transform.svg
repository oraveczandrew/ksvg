<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(45 0.5 0.5)">
      <stop offset="0" stop-color="red"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5" gradientTransform="scale(1.5)">
      <stop offset="0" stop-color="yellow"/>
      <stop offset="1" stop-color="green"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="url(#g1)"/>
  <rect x="110" y="110" width="80" height="80" fill="url(#g2)"/>
</svg>
