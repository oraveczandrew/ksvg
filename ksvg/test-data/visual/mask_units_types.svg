<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="lum" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="10" y="10" width="100" height="180" mask-type="luminance">
      <rect x="10" y="10" width="100" height="180" fill="white"/>
      <circle cx="60" cy="100" r="48" fill="black"/>
    </mask>
    <mask id="alpha" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox" mask-type="alpha">
      <rect x="0" y="0" width="1" height="1" fill="black"/>
      <circle cx="0.5" cy="0.5" r="0.5" fill="white"/>
    </mask>
  </defs>
  <rect x="10" y="10" width="100" height="180" fill="orangered" mask="url(#lum)"/>
  <rect x="130" y="10" width="100" height="180" fill="royalblue" mask="url(#alpha)"/>
  <text x="60" y="205" text-anchor="middle" font-size="12">luminance</text>
  <text x="180" y="205" text-anchor="middle" font-size="12">alpha</text>
</svg>
