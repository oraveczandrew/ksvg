<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5252"/>
      <stop offset="0.25" stop-color="#ffb300"/>
      <stop offset="0.5" stop-color="#00c853"/>
      <stop offset="0.75" stop-color="#448aff"/>
      <stop offset="1" stop-color="#d500f9"/>
    </linearGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff8e1"/>
      <rect width="8" height="8" fill="#ff8f00"/>
      <rect x="8" y="8" width="8" height="8" fill="#ff8f00"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#263238"/>
  <!-- circle() radius interpolation -->
  <rect x="8" y="8" width="112" height="112" fill="url(#rainbow)" clip-path="circle(8px at center center)">
    <animate attributeName="clip-path" from="circle(8px at center center)" to="circle(50px at center center)"
      begin="0s" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- inset() interpolation -->
  <rect x="136" y="8" width="112" height="112" fill="url(#checker)" clip-path="inset(40px)">
    <animate attributeName="clip-path" from="inset(40px)" to="inset(8px)"
      begin="0s" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- ellipse() interpolation -->
  <rect x="8" y="136" width="112" height="112" fill="url(#rainbow)" clip-path="ellipse(10px 8px at center center)">
    <animate attributeName="clip-path" from="ellipse(10px 8px at center center)" to="ellipse(50px 34px at center center)"
      begin="0s" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- mismatched shapes stay discrete -->
  <rect x="136" y="136" width="112" height="112" fill="url(#checker)" clip-path="circle(30px at center center)">
    <animate attributeName="clip-path" calcMode="discrete" begin="0s" dur="4s" repeatCount="indefinite"
      values="circle(30px at center center);inset(20px 20px 20px 20px);inset(20px 20px 20px 20px)"
      keyTimes="0;0.5;1"/>
  </rect>
</svg>
