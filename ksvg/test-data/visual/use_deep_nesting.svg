<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <rect id="r1" width="20" height="20" fill="red" />

    <g id="g1">
      <use href="#r1" x="0" y="0" />
      <use href="#r1" x="30" y="0" fill="blue" />
    </g>

    <g id="g2">
      <use href="#g1" x="0" y="0" />
      <use href="#g1" x="0" y="30" opacity="0.5" />
    </g>
  </defs>

  <use href="#g2" x="50" y="50" />
  <use href="#g2" x="120" y="50" transform="rotate(45 130 60)" />
</svg>
