<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="base" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="gold"/><rect x="10" y="10" width="10" height="10" fill="gold"/>
    </pattern>
    <pattern id="derived" href="#base" x="0" y="0" width="40" height="40" patternTransform="rotate(20)" viewBox="0 0 20 20" preserveAspectRatio="xMidYMid meet"/>
  </defs>
  <rect x="10" y="10" width="220" height="200" fill="url(#derived)"/>
</svg>
