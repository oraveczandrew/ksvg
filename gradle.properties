android.useAndroidX=true
android.enableBuildConfigAsBytecode=true
android.keepWorkerActionServicesBetweenBuilds=true

org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC

kotlin.incremental=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental.jvm.fir=true
kotlin.parallel.tasks.in.project=true

android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,\
  android.useConditionalKeepRules,\
  android.enableAppCompileTimeRClass,\
  android.enableBuildConfigAsBytecode,\
  android.experimental.verifyLibraryClasses,\
  android.keepWorkerActionServicesBetweenBuilds
