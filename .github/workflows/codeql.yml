# CodeQL code scanning for java-kotlin + cpp (Advanced setup, manual build).
# The GitHub Default setup (autobuild) cannot build this Android project:
# it provides neither the workspace SDK nor the pinned JDK, so extraction
# fails. This workflow reuses the CI SDK setup (full, incl. NDK/CMake: the
# :filtering native kernels need it) and traces a plain assembleDebug of the
# library modules (no tests, no emulator).
#
# NOTE: the handwritten per-ISA kernels (*.S) are invisible to the cpp
# extractor (it traces C/C++ compilations only); the .cpp sources that
# #include them are still analyzed. Per-ABI source selection lives in
# CMakeLists.txt via ANDROID_ABI, so the build below intentionally covers
# ALL ABIs (no -PfilterAbis): a single-ABI build would leave ABI-specific
# .cpp files out of the cpp database.
name: CodeQL

on:
  push:
    branches: ["master"]
    paths-ignore:
      # CodeQL-exempt housekeeping: changes here cannot affect analysis results.
      # (Deliberately NOT exempt: codeql.yml itself, ci.yml/pr.yml, the shared
      # setup-android-sdk action, modules, Gradle files.)
      - '.github/workflows/cleanup-caches.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/static.yml'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.idea/**'
  pull_request:
    # PRs touching scanned code or the build itself get an analysis run
    # (this also lets codeql.yml changes be tested before reaching master).
    paths:
      - '**.kt'
      - '**.kts'
      - '**.cpp'
      - '**.h'
      - '**.S'
      - 'CMakeLists.txt'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-android-sdk/**'
  schedule:
    # Mondays 03:00 UTC (cleanup-caches runs Sundays, so no cache contention).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Setup workspace Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin,cpp
          build-mode: manual
          queries: security-extended

      # Library modules only: :showcase (demo app) and :baselineprofile need
      # no code scanning, and assembleDebug keeps emulator/tests/multilib out.
      - name: Build (CodeQL trace)
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug :compose:assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v3
