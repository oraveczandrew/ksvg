# Release: pushing a `v*` tag (e.g. `v1.0.0-beta01`) builds the release AARs
# (+ sources/javadoc jars) and attaches them to a GitHub Release.
# The tag must match `ksvg.version` in gradle.properties (checked below).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Check tag matches ksvg.version
        run: |
          VERSION=$(grep '^ksvg.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=v$TAG ksvg.version=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag does not match ksvg.version in gradle.properties"
            exit 1
          fi
          echo "KSVG_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup workspace Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Restore release keystore
        # SHOWCASE_KEYSTORE_BASE64 holds the base64 of the upload keystore;
        # passwords/alias ride as separate secrets (see env below).
        run: |
          echo "$SHOWCASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/showcase-release.jks"
          echo "KSVG_KEYSTORE_FILE=$RUNNER_TEMP/showcase-release.jks" >> "$GITHUB_ENV"
        env:
          SHOWCASE_KEYSTORE_BASE64: ${{ secrets.SHOWCASE_KEYSTORE_BASE64 }}

      - name: Publish to staging repo
        # The same artifacts that would go to Central/GH Packages (AAR, sources,
        # Javadoc, POM, module metadata), redirected into dist/repo.
        # Signing stays off here (publishToMavenLocal never requires keys).
        env:
          KSVG_KEYSTORE_PASSWORD: ${{ secrets.SHOWCASE_KEYSTORE_PASSWORD }}
          KSVG_KEY_ALIAS: ${{ secrets.SHOWCASE_KEY_ALIAS }}
          KSVG_KEY_PASSWORD: ${{ secrets.SHOWCASE_KEY_PASSWORD }}
        run: >
          ./gradlew
          :ksvg:publishReleasePublicationToMavenLocal
          :filtering:publishReleasePublicationToMavenLocal
          :glide:publishReleasePublicationToMavenLocal
          :showcase:assembleRelease
          "-Dmaven.repo.local=$GITHUB_WORKSPACE/dist/repo"

      - name: Collect demo APK
        # Release APK (R8-minified, profileable) signed with the release key
        # when the keystore secret is present, unsigned otherwise.
        run: |
          ls showcase/build/outputs/apk/release/
          cp showcase/build/outputs/apk/release/showcase-release*.apk \
            "dist/ksvg-showcase-$KSVG_VERSION.apk"
          ls -la dist dist/repo | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # NOTE: test-fixtures AARs are inter-module test reuse only
          # (testFixtures(project(":filtering"))) — AGP attaches them to the
          # release publication automatically; they must not ship. Central
          # upload (D-track) needs the same exclusion at publishing time.
          files: |
            dist/*.apk
            dist/repo/**/*.aar
            !dist/repo/**/*-test-fixtures.aar
            dist/repo/**/*-sources.jar
            dist/repo/**/*-javadoc.jar
            dist/repo/**/*.pom
            dist/repo/**/*.module
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
