# Release: pushing a `v*` tag (e.g. `v1.0.0-beta01`) builds the release AARs
# (+ sources/javadoc jars) and attaches them to a GitHub Release.
# The tag must match `ksvg.version` in gradle.properties (checked below).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Check tag matches ksvg.version
        run: |
          VERSION=$(grep '^ksvg.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=v$TAG ksvg.version=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag does not match ksvg.version in gradle.properties"
            exit 1
          fi
          echo "KSVG_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          # Trailing -vN is a manual epoch: bump it whenever the package list
          # changes OR a run restores the cache yet sdkmanager re-downloads
          # everything anyway (a stale blob pins itself on exact-match hits).
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1-v3

      # Lists what the restore delivered, for diagnosing cache misses.
      - name: Inspect restored SDK cache
        run: |
          du -sh .ci-android-sdk 2>/dev/null || echo "no .ci-android-sdk directory"
          ls .ci-android-sdk 2>/dev/null || true
          du -sh .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true
          ls .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # Converge to exactly the pinned set, then install what's missing.
          # Stale revisions are purged (they once lingered beside pinned
          # ones); presence — not sdkmanager's verdict — decides.
          SDK="$GITHUB_WORKSPACE/.ci-android-sdk"
          for d in "$SDK"/platforms/* "$SDK"/build-tools/* "$SDK"/ndk/* "$SDK"/cmake/*; do
            [ -e "$d" ] || continue
            case "$d" in
              */android-37.2|*/37.0.0|*/29.0.14206865|*/3.22.1) ;;
              *) echo "purging stale: $d"; rm -rf "$d" ;;
            esac
          done
          # Install per package, so a cache miss (or a purge above) only
          # downloads what is actually absent.
          # License bootstrap first (both known text generations); `yes |`
          # on the installs below accepts anything new inline.
          mkdir -p "$SDK/licenses"
          printf '\n%s\n%s' 8933bad161af4178b1185d1a37fbf41ea5269c 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf '\n%s\n%s' d56f5187479451eabf01fb78af6dfcb131a648 84831b9409646a918e30573bab4c9c91346d8abd > "$SDK/licenses/android-sdk-preview-license"
          [ -d "$SDK/platforms/android-37.2" ] || yes | sdkmanager --sdk_root="$SDK" --install "platforms;android-37.2"
          [ -d "$SDK/build-tools/37.0.0" ] || yes | sdkmanager --sdk_root="$SDK" --install "build-tools;37.0.0"
          [ -d "$SDK/ndk/29.0.14206865" ] || yes | sdkmanager --sdk_root="$SDK" --install "ndk;29.0.14206865"
          [ -d "$SDK/cmake/3.22.1" ] || yes | sdkmanager --sdk_root="$SDK" --install "cmake;3.22.1"

          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      - name: Publish to staging repo
        # Same artifacts that would go to Central/GH Packages (AAR, sources,
        # javadoc, POM, module metadata), redirected into dist/repo.
        # Signing stays off here (publishToMavenLocal never requires keys).
        run: >
          ./gradlew
          :ksvg:publishReleasePublicationToMavenLocal
          :filtering:publishReleasePublicationToMavenLocal
          :glide:publishReleasePublicationToMavenLocal
          :showcase:assembleDebug
          "-Dmaven.repo.local=$GITHUB_WORKSPACE/dist/repo"

      - name: Collect demo APK
        # Debug APK (auto-signed): try-out demo, not the published library.
        run: |
          cp showcase/build/outputs/apk/debug/showcase-debug.apk \
            "dist/ksvg-showcase-$KSVG_VERSION.apk"
          ls -la dist dist/repo | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/repo/**/*.aar
            dist/repo/**/*-sources.jar
            dist/repo/**/*-javadoc.jar
            dist/repo/**/*.pom
            dist/repo/**/*.module
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
