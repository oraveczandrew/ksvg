# Release: pushing a `v*` tag (e.g. `v1.0.0-beta01`) builds the release AARs
# (+ sources/javadoc jars) and attaches them to a GitHub Release.
# The tag must match `ksvg.version` in gradle.properties (checked below).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Check tag matches ksvg.version
        run: |
          VERSION=$(grep '^ksvg.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=v$TAG ksvg.version=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag does not match ksvg.version in gradle.properties"
            exit 1
          fi
          echo "KSVG_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --sdk_root="$GITHUB_WORKSPACE/.ci-android-sdk" --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --sdk_root="$GITHUB_WORKSPACE/.ci-android-sdk" --licenses > /dev/null
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      - name: Publish to staging repo
        # Same artifacts that would go to Central/GH Packages (AAR, sources,
        # javadoc, POM, module metadata), redirected into dist/repo.
        # Signing stays off here (publishToMavenLocal never requires keys).
        run: >
          ./gradlew
          :ksvg:publishReleasePublicationToMavenLocal
          :filtering:publishReleasePublicationToMavenLocal
          :glide:publishReleasePublicationToMavenLocal
          :showcase:assembleDebug
          "-Dmaven.repo.local=$GITHUB_WORKSPACE/dist/repo"

      - name: Collect demo APK
        # Debug APK (auto-signed): try-out demo, not the published library.
        run: |
          cp showcase/build/outputs/apk/debug/showcase-debug.apk \
            "dist/ksvg-showcase-$KSVG_VERSION.apk"
          ls -la dist dist/repo | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/repo/**/*.aar
            dist/repo/**/*-sources.jar
            dist/repo/**/*-javadoc.jar
            dist/repo/**/*.pom
            dist/repo/**/*.module
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
