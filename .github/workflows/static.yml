# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          # Trailing -vN is a manual epoch: bump it whenever the package list
          # changes OR a run restores the cache yet sdkmanager re-downloads
          # everything anyway (a stale blob pins itself on exact-match hits).
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1-v2

      # Lists what the restore actually delivered (partial vs. unrecognized).
      - name: Inspect restored SDK cache
        run: |
          du -sh .ci-android-sdk 2>/dev/null || echo "no .ci-android-sdk directory"
          ls .ci-android-sdk 2>/dev/null || true
          du -sh .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # Fast path: the cache already delivered every package. sdkmanager
          # re-downloads them anyway when it cannot parse another image's
          # metadata, so directory presence — not sdkmanager's verdict — is
          # the check (AGP/CMake/NDK never read that metadata).
          SDK="$GITHUB_WORKSPACE/.ci-android-sdk"
          MISSING=0
          for p in "platforms/android-37*" "build-tools/37.0.0" "ndk/29.0.14206865" "cmake/3.22.1"; do
            if ! compgen -G "$SDK/$p" > /dev/null; then echo "missing: $p"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            sdkmanager --sdk_root="$SDK" --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          else
            echo "all SDK packages present, skipping sdkmanager install"
          fi
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      - name: Generate API docs
        run: ./gradlew :ksvg:dokkaGeneratePublicationHtml

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload generated Dokka site
          path: './doc'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
