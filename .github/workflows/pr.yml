# PR gate: host unit tests (incl. native parity), Android lint, coverage report,
# and a secret-free release-assemble guard (signing must never be required here).
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR head: newer pushes cancel stale in-progress runs.
concurrency:
  group: "pr-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The SDK packages live in a workspace-local directory (NOT the
      # preinstalled $ANDROID_SDK_ROOT, which is image-provided and ephemeral)
      # so actions/cache can persist them across runs: without the cache every
      # run re-downloads ~GBs (mostly the NDK).
      # Do NOT use android-actions/setup-android@v3 here: it installs the
      # long-removed obsolete "tools" package and fails on current
      # cmdline-tools ("Failed to find package 'tools'").
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --sdk_root="$GITHUB_WORKSPACE/.ci-android-sdk" --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --sdk_root="$GITHUB_WORKSPACE/.ci-android-sdk" --licenses > /dev/null
          # Point all later steps (Gradle/AGP) at the workspace SDK. CI-only:
          # local checkouts keep using local.properties.
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      # Host unit tests, incl. the filtering native-parity suites (x86_64
      # libksvgfilters is built by the buildHostNativeLib task dependency).
      - name: Unit + parity tests
        run: |
          ./gradlew :ksvg:testDebugUnitTest -PexcludeSlowTests \
            :filtering:testDebugUnitTest :glide:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :ksvg:lintDebug

      - name: Coverage report
        run: ./gradlew :ksvg:jacocoTestReport

      # Numeric ratchet (LINE 0.70 / BRANCH 0.50): fails on large coverage
      # drops. Raise together with real gains, never lower to fit a PR.
      - name: Coverage gate
        run: ./gradlew :ksvg:jacocoTestCoverageVerification

      # Signing guard: release assembly must succeed with NO signing secrets
      # configured (signing only runs on publish, never on the PR path).
      # No signing.* properties or key files are provided here on purpose.
      - name: Secret-free release assemble
        run: ./gradlew :ksvg:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            ksvg/build/test-results/testDebugUnitTest/
            filtering/build/test-results/testDebugUnitTest/
            glide/build/test-results/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ksvg/build/reports/jacoco/jacocoTestReport/
