# Continuous Integration: build + fast unit tests on every push to the
# default branch and on manual dispatch. The heavier PR gate (parity,
# lint, coverage, signing guard) lives in pr.yml.
name: CI

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Two legs: x64 runs the full suite against the x86_64 kernels and assembles
  # every Android ABI (incl. x86, the on-device 32-bit Intel path), arm64 runs
  # the :filtering unit tests (incl. native parity) against the aarch64 NEON
  # kernels built as a host lib on the runner itself. Either leg catches its
  # ISA's asm regressions here, not on device. Past catches: .addrsig
  # rejected by gas in 32-bit mode; EVEX-encoded broadcast (SIGILL on
  # AVX512-less hosts, fixed by VEX-only lowering).
  # NOTE: the 32-bit Intel kernels are additionally build-verified as a -m32
  # host lib on x64 (different toolchain than the NDK: system GCC multilib).
  # The i386 .S kernels are NEVER executed here: 32-bit test execution was
  # tried (2026-09-25) and reverted — 44 tests passed, then the worker JVM
  # died with an irrecoverable SI_KERNEL SIGSEGV in HotSpot's own signal
  # handler (hosted kernel's 32-bit signal handling is unstable).
  # Details: tmp/SIGILL_FLAKY_WORKLOG.md (git-ignored).
  build-and-test:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x64
            runs-on: ubuntu-24.04
            jdk-arch: x64
            cache-suffix: ""
            test-tasks: ":ksvg:testDebugUnitTest -PexcludeSlowTests :filtering:testDebugUnitTest :glide:testDebugUnitTest"
            artifact: ci-test-reports
            report-path: |
              ksvg/build/test-results/testDebugUnitTest/
              filtering/build/test-results/testDebugUnitTest/
              glide/build/test-results/testDebugUnitTest/
              filtering/hs_err_pid*.log
              ksvg/hs_err_pid*.log
              glide/hs_err_pid*.log
          - host: arm64
            runs-on: ubuntu-24.04-arm
            jdk-arch: arm64
            cache-suffix: "-arm64"
            # No NDK/CMake SDK packages here (their binaries are x86_64-only
            # and nothing on this leg uses them): platform for compiling
            # against android.jar, build-tools for AGP's pinned revision.
            # Separate cache key: the blob contents differ by architecture.
            test-tasks: ":filtering:testDebugUnitTest"
            artifact: ci-test-reports-arm64
            report-path: |
              filtering/build/host-native/
              filtering/build/test-results/testDebugUnitTest/
              filtering/hs_err_pid*.log
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: ${{ matrix.jdk-arch }}
          cache: gradle

      # x64 only: compile/link the -m32 host lib (see NOTE above); nothing
      # 32-bit is executed.
      - name: Install 32-bit multilib toolchain
        if: matrix.host == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # arm64 only: the host-native build uses the system toolchain (the SDK
      # NDK/CMake binaries are x86_64-only and unused on this leg).
      - name: Install host build toolchain
        if: matrix.host == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      # The SDK packages live in a workspace-local directory (NOT the
      # preinstalled $ANDROID_SDK_ROOT, which is image-provided and ephemeral)
      # so actions/cache can persist them across runs: without the cache every
      # run re-downloads ~GBs (mostly the NDK).
      # The trailing -vN suffix is a manual epoch: bump it whenever the
      # package list changes OR a run restores the cache yet sdkmanager
      # re-downloads everything anyway (a stale/partial blob pins itself
      # forever on exact-match hits, so it must be abandoned, never
      # repaired in place).
      # Do NOT use android-actions/setup-android@v3 here: it installs the
      # long-removed obsolete "tools" package and fails on current
      # cmdline-tools ("Failed to find package 'tools'").
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1-v3${{ matrix.cache-suffix }}

      # Lists what the restore delivered, for diagnosing cache misses.
      - name: Inspect restored SDK cache
        run: |
          du -sh .ci-android-sdk 2>/dev/null || echo "no .ci-android-sdk directory"
          ls .ci-android-sdk 2>/dev/null || true
          du -sh .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true
          ls .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true

      - name: Install SDK packages
        run: |
          # Locate a working sdkmanager: its image location moved across
          # generations ($ANDROID_SDK_ROOT unset or versioned dirs without a
          # `latest` link), so probe well-known roots instead of assuming one
          # PATH. Fails loudly when nothing is found.
          SDKMGR=""
          for root in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$root" ] || continue
            for ctd in "$root"/cmdline-tools/latest "$root"/cmdline-tools/*; do
              if [ -x "$ctd/bin/sdkmanager" ]; then SDKMGR="$ctd/bin/sdkmanager"; break 2; fi
            done
          done
          if [ -z "$SDKMGR" ]; then echo "no sdkmanager found (checked image SDK locations)"; exit 1; fi
          export PATH="$(dirname "$SDKMGR"):$PATH"
          echo "using sdkmanager: $SDKMGR"
          # Converge to exactly the pinned set, then install what's missing.
          # Stale revisions are purged (they once lingered beside pinned
          # ones); presence — not sdkmanager's verdict — decides.
          SDK="$GITHUB_WORKSPACE/.ci-android-sdk"
          for d in "$SDK"/platforms/* "$SDK"/build-tools/* "$SDK"/ndk/* "$SDK"/cmake/*; do
            [ -e "$d" ] || continue
            case "$d" in
              */android-37.2|*/37.0.0|*/29.0.14206865|*/3.22.1) ;;
              *) echo "purging stale: $d"; rm -rf "$d" ;;
            esac
          done
          # Install per package, so a cache miss (or a purge above) only
          # downloads what is actually absent.
          # License bootstrap first (both known text generations); `yes |`
          # on the installs below accepts anything new inline.
          mkdir -p "$SDK/licenses"
          printf '\n%s\n%s' 8933bad161af4178b1185d1a37fbf41ea5269c 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          printf '\n%s\n%s' d56f5187479451eabf01fb78af6dfcb131a648 84831b9409646a918e30573bab4c9c91346d8abd > "$SDK/licenses/android-sdk-preview-license"
          [ -d "$SDK/platforms/android-37.2" ] || yes | sdkmanager --sdk_root="$SDK" --install "platforms;android-37.2"
          [ -d "$SDK/build-tools/37.0.0" ] || yes | sdkmanager --sdk_root="$SDK" --install "build-tools;37.0.0"
          # NDK/CMake live here only on x64 (their SDK binaries are x86_64-only
          # and nothing on arm64 uses them: the host build uses the system
          # toolchain installed above).
          if [ "${{ matrix.host }}" != "arm64" ]; then
            [ -d "$SDK/ndk/29.0.14206865" ] || yes | sdkmanager --sdk_root="$SDK" --install "ndk;29.0.14206865"
            [ -d "$SDK/cmake/3.22.1" ] || yes | sdkmanager --sdk_root="$SDK" --install "cmake;3.22.1"
          fi

          # Point all later steps (Gradle/AGP) at the workspace SDK. CI-only:
          # local checkouts keep using local.properties.
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      - name: Log runner CPU and JVM identity
        run: |
          java -version 2>&1
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E 'sse|avx|fma|bmi|xsave|osxsave|neon|asimd|sve' | sort -u | tr '\n' ' '
          echo
          # vsyscall mode decides whether a 32-bit JVM can start at all.
          grep -o 'vsyscall[^ ]*' /proc/cmdline 2>/dev/null || echo "no vsyscall boot param"

      - name: Assemble debug (all modules, all ABIs)
        if: matrix.host == 'x64'
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug

      # Verifies the i386 .S kernels assemble+link under GCC multilib (a
      # different toolchain than the NDK above). MUST run as its own Gradle
      # invocation BEFORE the tests below: both host-lib flavors share one
      # output file, and the test task rebuilds the x86_64 flavor via its
      # task dependency, so this order leaves the runnable library in place.
      - name: Build 32-bit host native lib
        if: matrix.host == 'x64'
        run: ./gradlew :filtering:buildHostNativeLib -Pksvg.host32bit=true

      - name: Build and test (${{ matrix.host }})
        run: ./gradlew ${{ matrix.test-tasks }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.report-path }}
