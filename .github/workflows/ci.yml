# Continuous Integration: build + fast unit tests on every push to the
# default branch and on manual dispatch. The heavier PR gate (parity,
# lint, coverage, signing guard) lives in pr.yml.
name: CI

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest images ship a preinstalled Android SDK
      # ($ANDROID_SDK_ROOT). Do NOT use android-actions/setup-android@v3
      # here: it installs the long-removed obsolete "tools" package and
      # fails on current cmdline-tools ("Failed to find package 'tools'").
      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Assemble debug (all modules)
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug

      - name: Fast unit tests (slow suites excluded)
        run: ./gradlew :ksvg:testDebugUnitTest -PexcludeSlowTests :filtering:testDebugUnitTest :glide:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports
          path: |
            ksvg/build/test-results/testDebugUnitTest/
            filtering/build/test-results/testDebugUnitTest/
            glide/build/test-results/testDebugUnitTest/
