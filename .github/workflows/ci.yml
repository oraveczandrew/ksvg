# Continuous Integration: build + fast unit tests on every push to the
# default branch and on manual dispatch. The heavier PR gate (parity,
# lint, coverage, signing guard) lives in pr.yml.
name: CI

on:
  push:
    branches: ["master", "main"]
    paths-ignore:
      # CI-exempt housekeeping: changes here cannot affect build/test results.
      # (Deliberately NOT exempt: ci.yml/pr.yml themselves, the shared
      # setup-android-sdk action, modules, Gradle files.)
      - '.github/workflows/cleanup-caches.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/static.yml'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Two legs: x64 runs the full suite against the x86_64 kernels and assembles
  # every Android ABI (incl. x86, the on-device 32-bit Intel path), arm64 runs
  # the :filtering unit tests (incl. native parity) against the aarch64 NEON
  # kernels built as a host lib on the runner itself. Either leg catches its
  # ISA's asm regressions here, not on device. Past catches: .addrsig
  # rejected by gas in 32-bit mode; EVEX-encoded broadcast (SIGILL on
  # AVX512-less hosts, fixed by VEX-only lowering).
  # NOTE: the 32-bit Intel kernels are additionally build-verified as a -m32
  # host lib on x64 (different toolchain than the NDK: system GCC multilib).
  # The i386 .S kernels are NEVER executed here: 32-bit test execution was
  # tried (2026-09-25) and reverted — 44 tests passed, then the worker JVM
  # died with an irrecoverable SI_KERNEL SIGSEGV in HotSpot's own signal
  # handler (hosted kernel's 32-bit signal handling is unstable).
  # Details: tmp/SIGILL_FLAKY_WORKLOG.md (git-ignored).
  build-and-test:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x64
            runs-on: ubuntu-24.04
            jdk-arch: x64
            cache-suffix: ""
            test-tasks: ":ksvg:testDebugUnitTest -PexcludeSlowTests :filtering:testDebugUnitTest :glide:testDebugUnitTest"
            artifact: ci-test-reports
            report-path: |
              ksvg/build/test-results/testDebugUnitTest/
              filtering/build/test-results/testDebugUnitTest/
              glide/build/test-results/testDebugUnitTest/
              filtering/hs_err_pid*.log
              ksvg/hs_err_pid*.log
              glide/hs_err_pid*.log
          - host: arm64
            runs-on: ubuntu-24.04-arm
            jdk-arch: arm64
            cache-suffix: "-arm64"
            # No NDK/CMake SDK packages here (their binaries are x86_64-only
            # and nothing on this leg uses them): platform for compiling
            # against android.jar, build-tools for AGP's pinned revision.
            # Separate cache key: the blob contents differ by architecture.
            test-tasks: ":filtering:testDebugUnitTest"
            artifact: ci-test-reports-arm64
            report-path: |
              filtering/build/host-native/
              filtering/build/test-results/testDebugUnitTest/
              filtering/hs_err_pid*.log
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: ${{ matrix.jdk-arch }}
          cache: gradle

      # x64 only: compile/link the -m32 host lib (see NOTE above); nothing
      # 32-bit is executed.
      - name: Install 32-bit multilib toolchain
        if: matrix.host == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # arm64 only: the host-native build uses the system toolchain (the SDK
      # NDK/CMake binaries are x86_64-only and unused on this leg).
      - name: Install host build toolchain
        if: matrix.host == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Setup workspace Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          cache-key-suffix: ${{ matrix.host == 'arm64' && '-arm64' || '' }}
          skip-ndk-cmake: ${{ matrix.host == 'arm64' }}

      - name: Log runner CPU and JVM identity
        run: |
          java -version 2>&1
          # ARM cpuinfo has neither `model name` nor `flags` (it shows CPU
          # part / Features instead); the `|| true` keeps this step green.
          grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true
          grep -m1 -E '^(flags|Features)' /proc/cpuinfo | tr ' ' '\n' | grep -E 'sse|avx|fma|bmi|xsave|osxsave|neon|asimd|sve' | sort -u | tr '\n' ' ' || true
          echo
          # vsyscall mode decides whether a 32-bit JVM can start at all.
          grep -o 'vsyscall[^ ]*' /proc/cmdline 2>/dev/null || echo "no vsyscall boot param"

      - name: Assemble debug (all modules, all ABIs)
        if: matrix.host == 'x64'
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug

      # Verifies the i386 .S kernels assemble+link under GCC multilib (a
      # different toolchain than the NDK above). MUST run as its own Gradle
      # invocation BEFORE the tests below: both host-lib flavors share one
      # output file, and the test task rebuilds the x86_64 flavor via its
      # task dependency, so this order leaves the runnable library in place.
      - name: Build 32-bit host native lib
        if: matrix.host == 'x64'
        run: ./gradlew :filtering:buildHostNativeLib -Pksvg.host32bit=true

      - name: Build and test (${{ matrix.host }})
        run: ./gradlew ${{ matrix.test-tasks }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.report-path }}

  # Executes the 32-bit Intel kernels for real on an x86 emulator under KVM.
  # (A 32-bit HotSpot cannot run on the hosted kernels themselves, so the
  # i386 host lib is build-only.) Runs only the @NativeParityTest
  # instrumented suites — same corpus and Kotlin oracle as the host tests —
  # against the x86 ABI test APK; no benchmarks.
  emulator-parity-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Recent emulator binaries link PulseAudio client libs, missing from
      # the runner image (qemu dies instantly with libpulse.so.0 not found).
      - name: Install emulator audio dependencies
        run: sudo apt-get update && (sudo apt-get install -y libpulse0t64 || sudo apt-get install -y libpulse0)

      - name: Setup workspace Android SDK
        uses: ./.github/actions/setup-android-sdk

      # Cache the emulator binary, system image and AVD state: together they
      # are GBs of downloads on a cold runner. Key pins api/arch/profile and
      # the pinned emulator build below.
      - name: Cache emulator and AVD
        uses: actions/cache@v5
        with:
          path: |
            .ci-android-sdk/emulator
            .ci-android-sdk/system-images
            ~/.android/avd
          key: android-emu-${{ runner.os }}-api29-x86-15917651-v1

      - name: Run parity tests on x86 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 6
          avd-name: ci-x86
          force-avd-creation: false
          emulator-build: 15917651
          script: ./gradlew :filtering:connectedDebugAndroidTest -PfilterAbis=x86 -Pandroid.testInstrumentationRunnerArguments.annotation=hu.oandras.ksvg.filtering.NativeParityTest

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-test-reports-x86
          path: |
            filtering/build/outputs/androidTest-results/connected/
