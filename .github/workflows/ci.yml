# Continuous Integration: build + fast unit tests on every push to the
# default branch and on manual dispatch. The heavier PR gate (parity,
# lint, coverage, signing guard) lives in pr.yml.
name: CI

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Single job definition, two legs on the same ubuntu-latest image: x64 runs
  # the full suite against the x86_64 kernels, i386 build-verifies the 32-bit
  # Intel kernels (-m32 host lib from the i386 .S files + Android x86 ABI via
  # the NDK), so x86-only asm regressions fail here, not on device.
  # NOTE: the i386 leg does NOT execute tests: a 32-bit JVM cannot start on
  # the hosted runners' kernels (32-bit HotSpot dies at startup with an
  # SI_KERNEL SIGSEGV in its signal handler under vsyscall=none, a kernel
  # boot setting we cannot change there). This already caught one real bug
  # (.addrsig rejected by gas in 32-bit mode).
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x64
            host32bit: "false"
            test-tasks: ":ksvg:testDebugUnitTest -PexcludeSlowTests :filtering:testDebugUnitTest :glide:testDebugUnitTest"
            artifact: ci-test-reports
            report-path: |
              ksvg/build/test-results/testDebugUnitTest/
              filtering/build/test-results/testDebugUnitTest/
              glide/build/test-results/testDebugUnitTest/
              filtering/hs_err_pid*.log
              ksvg/hs_err_pid*.log
              glide/hs_err_pid*.log
          - host: i386
            host32bit: "true"
            # No test execution (see NOTE above): build the -m32 host lib
            # (assembles + links every i386 .S kernel) and the Android x86
            # ABI with the NDK (the actual on-device 32-bit Intel path).
            test-tasks: ":filtering:buildHostNativeLib :filtering:assembleDebug -PfilterAbis=x86"
            artifact: ci-test-reports-i386
            report-path: |
              filtering/build/host-native/
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          cache: gradle

      - name: Install 32-bit multilib toolchain
        if: matrix.host32bit == 'true'
        run: |
          sudo apt-get update
          # Only needed to compile/link -m32; nothing 32-bit is executed.
          sudo apt-get install -y gcc-multilib g++-multilib

      # The SDK packages live in a workspace-local directory (NOT the
      # preinstalled $ANDROID_SDK_ROOT, which is image-provided and ephemeral)
      # so actions/cache can persist them across runs: without the cache every
      # run re-downloads ~GBs (mostly the NDK).
      # The trailing -vN suffix is a manual epoch: bump it whenever the
      # package list changes OR a run restores the cache yet sdkmanager
      # re-downloads everything anyway (a stale/partial blob pins itself
      # forever on exact-match hits, so it must be abandoned, never
      # repaired in place).
      # Do NOT use android-actions/setup-android@v3 here: it installs the
      # long-removed obsolete "tools" package and fails on current
      # cmdline-tools ("Failed to find package 'tools'").
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: .ci-android-sdk
          key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1-v2

      # The SDK cache has silently gone stale before (hit + full re-download
      # of NDK/build-tools/platform). This lists what the restore actually
      # delivered, so the log shows whether the blob is partial or merely
      # unrecognized by this image's sdkmanager.
      - name: Inspect restored SDK cache
        run: |
          du -sh .ci-android-sdk 2>/dev/null || echo "no .ci-android-sdk directory"
          ls .ci-android-sdk 2>/dev/null || true
          du -sh .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # Fast path: the cache already delivered every package. sdkmanager
          # re-downloads them anyway when it cannot parse another image's
          # metadata (seen: 2.5 GB restored, yet full reinstall), so directory
          # presence — not sdkmanager's verdict — is the check. AGP, CMake and
          # the NDK consume the files directly and never read that metadata.
          SDK="$GITHUB_WORKSPACE/.ci-android-sdk"
          MISSING=0
          for p in "platforms/android-37*" "build-tools/37.0.0" "ndk/29.0.14206865" "cmake/3.22.1"; do
            if ! compgen -G "$SDK/$p" > /dev/null; then echo "missing: $p"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            sdkmanager --sdk_root="$SDK" --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          else
            echo "all SDK packages present, skipping sdkmanager install"
          fi
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null
          # Point all later steps (Gradle/AGP) at the workspace SDK. CI-only:
          # local checkouts keep using local.properties.
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"

      - name: Log runner CPU and JVM identity
        run: |
          java -version 2>&1
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E 'sse|avx|fma|bmi|xsave|osxsave' | sort -u | tr '\n' ' '
          echo

      - name: Assemble debug (all modules)
        if: matrix.host32bit != 'true'
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug

      - name: Build and test (${{ matrix.host }})
        run: ./gradlew ${{ matrix.test-tasks }} -Pksvg.host32bit=${{ matrix.host32bit }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.report-path }}
