# Continuous Integration: build + fast unit tests on every push to the
# default branch and on manual dispatch. The heavier PR gate (parity,
# lint, coverage, signing guard) lives in pr.yml.
name: CI

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest images ship a preinstalled Android SDK
      # ($ANDROID_SDK_ROOT). Do NOT use android-actions/setup-android@v3
      # here: it installs the long-removed obsolete "tools" package and
      # fails on current cmdline-tools ("Failed to find package 'tools'").
      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Assemble debug (all modules)
        run: ./gradlew :ksvg:assembleDebug :filtering:assembleDebug :glide:assembleDebug

      - name: Fast unit tests (slow suites excluded)
        run: ./gradlew :ksvg:testDebugUnitTest -PexcludeSlowTests :filtering:testDebugUnitTest :glide:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-reports
          path: |
            ksvg/build/test-results/testDebugUnitTest/
            filtering/build/test-results/testDebugUnitTest/
            glide/build/test-results/testDebugUnitTest/

  # 32-bit Intel (i386) kernel parity: rebuilds the host libksvgfilters with
  # -m32 from the i386 .S kernels and runs the same native-parity suites the
  # 64-bit build exercises, so x86-only asm regressions fail here, not on device.
  host-32bit-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=none
      KSVG_HOST_32BIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 32-bit multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up 32-bit JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x86
          cache: gradle

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null

      - name: 32-bit native parity tests
        run: ./gradlew :filtering:testDebugUnitTest -Pksvg.host32bit=true

      - name: Upload 32-bit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-reports-i386
          path: filtering/build/test-results/testDebugUnitTest/
