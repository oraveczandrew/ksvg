# Shared workspace-SDK setup for CI jobs: restore the cached SDK packages,
# converge them to exactly the pinned set, and install what's missing.
# One call replaces ~60 lines of copy-pasted bash in every workflow.
#
# The SDK packages live in a workspace-local directory (NOT the preinstalled
# $ANDROID_SDK_ROOT, which is image-provided and ephemeral) so actions/cache
# can persist them across runs: without the cache every run re-downloads
# ~GBs (mostly the NDK).
# Do NOT use android-actions/setup-android@v3 here: it installs the
# long-removed obsolete "tools" package and fails on current cmdline-tools
# ("Failed to find package 'tools'").
name: Setup workspace Android SDK
description: Restore, converge and install the workspace-local Android SDK packages.

inputs:
  cache-key-suffix:
    description: Extra suffix for the cache key (e.g. "-arm64" when the blob contents differ by architecture).
    required: false
    default: ""
  skip-ndk-cmake:
    description: Skip the NDK/CMake SDK packages (their binaries are x86_64-only and unused where no native Android build runs, e.g. ubuntu-24.04-arm host tests).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Android SDK packages
      uses: actions/cache@v5
      with:
        path: .ci-android-sdk
        # Trailing -vN is a manual epoch: bump it whenever the package list
        # changes (a stale blob pins itself forever on exact-match hits).
        key: android-sdk-${{ runner.os }}-platform37.2-build37.0.0-ndk29.0.14206865-cmake3.22.1-v3${{ inputs.cache-key-suffix }}

    # Lists what the restore delivered, for diagnosing cache misses.
    - name: Inspect restored SDK cache
      shell: bash
      run: |
        du -sh .ci-android-sdk 2>/dev/null || echo "no .ci-android-sdk directory"
        ls .ci-android-sdk 2>/dev/null || true
        du -sh .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true
        ls .ci-android-sdk/platforms .ci-android-sdk/build-tools .ci-android-sdk/ndk .ci-android-sdk/cmake 2>/dev/null || true

    - name: Install SDK packages
      shell: bash
      run: |
        SDK="$GITHUB_WORKSPACE/.ci-android-sdk"
        # Locate a working sdkmanager: its image location moved across
        # generations ($ANDROID_SDK_ROOT unset or versioned dirs without a
        # `latest` link), so probe well-known roots instead of assuming one
        # PATH, bootstrapping cmdline-tools into the workspace SDK when the
        # image has none (e.g. ubuntu-24.04-arm).
        SDKMGR=""
        for root in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk /opt/android-sdk; do
          [ -n "$root" ] || continue
          for ctd in "$root"/cmdline-tools/latest "$root"/cmdline-tools/*; do
            if [ -x "$ctd/bin/sdkmanager" ]; then SDKMGR="$ctd/bin/sdkmanager"; break 2; fi
          done
        done
        if [ -z "$SDKMGR" ]; then
          # No image SDK (e.g. ubuntu-24.04-arm): fetch the
          # architecture-independent cmdline-tools into the workspace SDK.
          CLT_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fSL -o /tmp/cmdtools.zip "$CLT_URL"
          mkdir -p "$SDK/cmdline-tools"
          unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          rm -f /tmp/cmdtools.zip
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
        fi
        export PATH="$(dirname "$SDKMGR"):$PATH"
        echo "using sdkmanager: $SDKMGR"
        # Converge to exactly the pinned set, then install what's missing.
        # Stale revisions are purged (they once lingered beside pinned
        # ones); presence — not sdkmanager's verdict — decides.
        for d in "$SDK"/platforms/* "$SDK"/build-tools/* "$SDK"/ndk/* "$SDK"/cmake/*; do
          [ -e "$d" ] || continue
          case "$d" in
            */android-37.2|*/37.0.0|*/29.0.14206865|*/3.22.1) ;;
            *) echo "purging stale: $d"; rm -rf "$d" ;;
          esac
        done
        # Install per package, so a cache miss (or a purge above) only
        # downloads what is actually absent.
        # License bootstrap first (both known text generations); `yes |`
        # on the installs below accepts anything new inline.
        mkdir -p "$SDK/licenses"
        printf '\n%s\n%s' 8933bad161af4178b1185d1a37fbf41ea5269c 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
        printf '\n%s\n%s' d56f5187479451eabf01fb78af6dfcb131a648 84831b9409646a918e30573bab4c9c91346d8abd > "$SDK/licenses/android-sdk-preview-license"
        [ -d "$SDK/platforms/android-37.2" ] || yes | sdkmanager --sdk_root="$SDK" --install "platforms;android-37.2"
        [ -d "$SDK/build-tools/37.0.0" ] || yes | sdkmanager --sdk_root="$SDK" --install "build-tools;37.0.0"
        if [ "${{ inputs.skip-ndk-cmake }}" != "true" ]; then
          [ -d "$SDK/ndk/29.0.14206865" ] || yes | sdkmanager --sdk_root="$SDK" --install "ndk;29.0.14206865"
          [ -d "$SDK/cmake/3.22.1" ] || yes | sdkmanager --sdk_root="$SDK" --install "cmake;3.22.1"
        fi

        # Point all later steps (Gradle/AGP) at the workspace SDK. CI-only:
        # local checkouts keep using local.properties.
        echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci-android-sdk" >> "$GITHUB_ENV"
